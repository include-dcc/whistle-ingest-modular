study_id: DS-HPBM
study_accession:  
study_title: "Down syndrome early postnatal basal forebrain multiome"
study_desc:
url: 
identifier_prefix: https://includedcc.org/fhir/dshpbm
dd_prefix: https://includedcc.org/fhir
output_filename: dshpbm
id_colname: Participant ID
organization: INCLUDE DCC

projection_version: current
whistle_src: _entry.wstl

# This is where the harmony file will be written 
code_harmonization_dir: harmony/dshpbm

# This is the prefix associated with the final study harmony file
# This must match whatever is used in the whistle code (which is data-harmony
# at this time)
harmony_prefix: data-harmony

# List each file required to support the level of harmonized terms required
# by this project. 
code_harmonization: 
 - harmony/study.csv
 - harmony/dataset.csv
 - harmony/datafile.csv
 - harmony/demographics.csv
 - harmony/encounter.csv
 - harmony/misc.csv
 - harmony/specimen.csv
 - harmony/ds-hpbm-conditions.csv
projections: 
  study: projector/study_only
  dataset: projector/dataset
  harmonized: projector/harmonized

require_official: True
curies:
  http://purl.obolibrary.org/obo/hp.owl: HP
  http://purl.obolibrary.org/obo/mondo.owl: MONDO
  http://purl.obolibrary.org/obo/maxo.owl: MAXO
  http://purl.obolibrary.org/obo/ncit.owl: NCIT
  http://snomed.info/sct: SNOMED
  https://loinc.org/: LOINC
projector_lib: projector/study_only/current
env:
  local: dev
  dev: dev
  qa: qa-kf2-inc
  prod: prd-kf2-inc
dataset:
  study_meta: 
    filename: data/tables/DS-HPBM/study.csv
    data_dictionary:
      filename: data/dd/study.csv
  study_contacts:
    hidden: true
    filename: data/tables/DS-HPBM/contacts.csv
    data_dictionary: 
      filename: data/dd/contacts.csv
    embed:
      dataset: study_meta
      colname: Study Code
  participant:
    filename: data/tables/DS-HPBM/DS-HPBM_harmonized_participant_2026-01-14.csv
    data_dictionary: 
      filename: data/dd/participant.csv
  condition:
    filename: data/tables/DS-HPBM/DS-HPBM_harmonized_condition_2026-01-15.csv
    embed:
      dataset: participant
      colname: Participant External ID
    data_dictionary: 
      filename: data/dd/condition.csv
  specimen:
    filename: data/tables/DS-HPBM/DS-HPBM_harmonized_biospecimen_2026-01-23.csv
    subject_id: Participant External ID
    key_columns: Sample Global ID
    group_by: Participant External ID, Sample External ID
    data_dictionary:
      filename: data/dd/specimen.csv
  encounter:
    hidden: true
    filename: data/tables/DS-HPBM/encounter.csv
    data_dictionary: 
      filename: data/dd/encounter.csv
    embed: 
      dataset: participant 
      colname: Participant External ID
  dataset_meta:
    filename: data/tables/DS-HPBM/datasets.csv
    data_dictionary:
      filename: data/dd/dataset_meta.csv
  dataset_manifest:
    filename: data/tables/DS-HPBM/DS-HPBM-BF-UH-Clinical_dataset_manifest_2026-04-02.csv,data/tables/DS-HPBM/DS-HPBM-BF-snATACseq_dataset_manifest_2026-04-02.csv,data/tables/DS-HPBM/DS-HPBM-BF-snRNAseq_dataset_manifest_2025-10-15.csv,data/tables/DS-HPBM/DS-HPBM-PFC-UH-Clinical_dataset_manifest_2026-04-02.csv,data/tables/DS-HPBM/DS-HPBM-PFC-snATACseq_dataset_manifest_2026-04-02.csv,data/tables/DS-HPBM/DS-HPBM-PFC-snRNAseq_dataset_manifest_2026-04-02.csv
    data_dictionary:
      filename: data/dd/dataset_manifest.csv
    embed: 
      dataset: dataset_meta
      colname: Dataset External ID
  file_manifest:
  # Datafiles for sequencing are in one manifest, separate manifests for UH Clinical datafiles
    filename: data/tables/DS-HPBM/DS-HPBM_harmonized_datafile_2026-04-02.csv
    data_dictionary:
      filename: data/dd/datafile.csv
    # group_by: File S3 Location
  participant_file_manifest:
    filename: data/tables/DS-HPBM/DS-HPBM-BF-UH-clinical_participant_datafile_2026-04-02.csv,data/tables/DS-HPBM/DS-HPBM-PFC-UH-clinical_participant_datafile_2026-04-02.csv
    data_dictionary:
      filename: data/dd/participant_file_manifest.csv
    embed:
      dataset: file_manifest
      colname: File Global ID
active_tables:
  ALL: true
#  family: true